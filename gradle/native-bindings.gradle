// Applied from build.gradle. Generates the two Java views of the native surface from
// src/main/java/com/github/tatercertified/nalim/rust/NalimBindings.java:
//  * RustmiLib   (main source set) — the facade every caller uses; one static final branch,
//                                    folded by the JIT, picks Nalim or FFM (NativeBackend);
//  * FfmBindings (ffm source set)  — Foreign Function & Memory downcalls, compiled for Java 25.
// NativeBindingsContractTest checks both against native/lib.h (cbindgen output).

def bindingsSource = file('src/main/java/com/github/tatercertified/nalim/rust/NalimBindings.java')
def generatedFacadeDir = layout.buildDirectory.dir('generated/nativeBindings/main')
def generatedFfmDir = layout.buildDirectory.dir('generated/nativeBindings/ffm')

sourceSets {
    ffm {
        java.srcDir(generatedFfmDir)
    }
    main {
        java.srcDir(generatedFacadeDir)
    }
}

dependencies {
    implementation sourceSets.ffm.output
}

tasks.register('generateNativeBindings') {
    inputs.file(bindingsSource)
    outputs.dirs(generatedFacadeDir, generatedFfmDir)

    doLast {
        def layouts = [int: 'JAVA_INT', long: 'JAVA_LONG', double: 'JAVA_DOUBLE', float: 'JAVA_FLOAT',
                       byte: 'JAVA_BYTE', short: 'JAVA_SHORT']
        def text = bindingsSource.text.replaceAll(/(?s)\/\*.*?\*\//, '').replaceAll(/\/\/[^\n]*/, '')
        def matcher = text =~ /((?:@\w+(?:\([^)]*\))?\s+)+)public static native (\w+) (\w+)\(([^)]*)\);/
        def functions = []
        matcher.each { all, annotations, ret, name, rawParams ->
            def symbol = name
            def critical = false
            // Only shapes FFM can reproduce: @Link naked/@Code bodies use the Java calling
            // convention or inline machine code, which a downcall cannot express.
            (annotations =~ /@\w+(?:\([^)]*\))?/).each { String annotation ->
                def linkName = annotation =~ /^@Link\(\s*name\s*=\s*"(\w+)"\s*\)$/
                if (annotation == '@Critical') {
                    critical = true
                } else if (linkName.matches()) {
                    symbol = linkName.group(1)
                } else if (annotation != '@Link') {
                    throw new GradleException("Unsupported annotation '${annotation}' on ${name}")
                }
            }
            def params = rawParams.trim().isEmpty() ? [] : rawParams.split(',').collect {
                def parts = it.trim().split(/\s+/)
                if (parts.length != 2) {
                    throw new GradleException("Unsupported parameter '${it}' in ${name}")
                }
                [type: parts[0], name: parts[1]]
            }
            ([ret] + params*.type).each { t ->
                if (t != 'void' && !layouts.containsKey(t)) {
                    throw new GradleException("Unsupported native type '${t}' in ${name}")
                }
            }
            functions << [ret: ret, name: name, params: params, symbol: symbol, critical: critical]
        }
        def declared = (text =~ /\bnative\s+\w+\s+\w+\s*\(/).size()
        if (functions.isEmpty() || declared != functions.size()) {
            throw new GradleException("Parsed ${functions.size()} of ${declared} native declarations in " +
                    "${bindingsSource}; keep each as '@Link... public static native <type> name(<params>);'")
        }

        def pkg = 'com.github.tatercertified.nalim.rust'
        def sig = { f -> f.params.collect { "${it.type} ${it.name}" }.join(', ') }
        def args = { f -> f.params*.name.join(', ') }

        def facade = new StringBuilder()
        facade << "package ${pkg};\n\n"
        facade << "/** GENERATED from NalimBindings.java by gradle/native-bindings.gradle — edit NalimBindings.java instead. */\n"
        facade << "public final class RustmiLib {\n"
        facade << "    private RustmiLib() {}\n\n"
        facade << "    /** Decided once by NativeBackend before any caller runs; folded by the JIT. */\n"
        facade << "    private static final boolean NALIM = com.github.tatercertified.nalim.NativeBackend.useNalim();\n"
        functions.each { f ->
            facade << "\n    public static ${f.ret} ${f.name}(${sig(f)}) {\n"
            if (f.ret == 'void') {
                facade << "        if (NALIM) {\n            NalimBindings.${f.name}(${args(f)});\n"
                facade << "        } else {\n            FfmBindings.${f.name}(${args(f)});\n        }\n"
            } else {
                facade << "        return NALIM ? NalimBindings.${f.name}(${args(f)}) : FfmBindings.${f.name}(${args(f)});\n"
            }
            facade << "    }\n"
        }
        facade << "}\n"

        def ffm = new StringBuilder()
        ffm << "package ${pkg};\n\n"
        ffm << "import java.lang.foreign.Arena;\nimport java.lang.foreign.FunctionDescriptor;\n"
        ffm << "import java.lang.foreign.Linker;\nimport java.lang.foreign.MemorySegment;\n"
        ffm << "import java.lang.foreign.SymbolLookup;\nimport java.lang.invoke.MethodHandle;\n"
        ffm << "import java.nio.file.Path;\n\n"
        ffm << "import static java.lang.foreign.ValueLayout.*;\n\n"
        ffm << "/**\n * GENERATED from NalimBindings.java by gradle/native-bindings.gradle — edit NalimBindings.java instead.\n"
        ffm << " * Foreign Function &amp; Memory downcalls into the library at {@code rustmi.native.path}.\n"
        ffm << " * Pointers travel as JAVA_LONG (all supported targets are LP64/LLP64); calls marked\n"
        ffm << " * {@code @Critical} skip the thread-state transition, like every Nalim call.\n */\n"
        ffm << "public final class FfmBindings {\n"
        ffm << "    private FfmBindings() {}\n\n"
        ffm << "    private static final Linker LINKER = Linker.nativeLinker();\n"
        ffm << "    private static final SymbolLookup LIBRARY = library();\n\n"
        ffm << "    private static SymbolLookup library() {\n"
        ffm << "        String path = System.getProperty(\"rustmi.native.path\");\n"
        ffm << "        if (path == null || path.isBlank()) {\n"
        ffm << "            throw new IllegalStateException(\"rustmi.native.path is not published\");\n        }\n"
        ffm << "        return SymbolLookup.libraryLookup(Path.of(path), Arena.global());\n    }\n\n"
        ffm << "    private static MethodHandle bind(String symbol, boolean critical, FunctionDescriptor descriptor) {\n"
        ffm << "        MemorySegment address = LIBRARY.find(symbol)\n"
        ffm << "                .orElseThrow(() -> new UnsatisfiedLinkError(\"Missing native symbol \" + symbol));\n"
        ffm << "        return critical\n"
        ffm << "                ? LINKER.downcallHandle(address, descriptor, Linker.Option.critical(false))\n"
        ffm << "                : LINKER.downcallHandle(address, descriptor);\n    }\n\n"
        ffm << "    private static RuntimeException rethrow(Throwable t) {\n"
        ffm << "        if (t instanceof RuntimeException r) {\n            return r;\n        }\n"
        ffm << "        if (t instanceof Error e) {\n            throw e;\n        }\n"
        ffm << "        return new IllegalStateException(t);\n    }\n"
        functions.each { f ->
            def argLayouts = f.params.collect { layouts[it.type] }.join(', ')
            def descriptor = f.ret == 'void'
                    ? "FunctionDescriptor.ofVoid(${argLayouts})"
                    : "FunctionDescriptor.of(${layouts[f.ret]}${argLayouts.isEmpty() ? '' : ', ' + argLayouts})"
            ffm << "\n    private static final MethodHandle H_${f.name} = bind(\"${f.symbol}\", ${f.critical},\n"
            ffm << "            ${descriptor});\n\n"
            ffm << "    public static ${f.ret} ${f.name}(${sig(f)}) {\n        try {\n"
            if (f.ret == 'void') {
                ffm << "            H_${f.name}.invokeExact(${args(f)});\n"
            } else {
                ffm << "            return (${f.ret}) H_${f.name}.invokeExact(${args(f)});\n"
            }
            ffm << "        } catch (Throwable t) {\n            throw rethrow(t);\n        }\n    }\n"
        }
        ffm << "}\n"

        def pkgPath = pkg.replace('.', '/')
        def facadeFile = generatedFacadeDir.get().file("${pkgPath}/RustmiLib.java").asFile
        def ffmFile = generatedFfmDir.get().file("${pkgPath}/FfmBindings.java").asFile
        [facadeFile, ffmFile]*.parentFile*.mkdirs()
        facadeFile.text = facade.toString()
        ffmFile.text = ffm.toString()
        println "Generated ${functions.size()} native bindings (Nalim facade + FFM)"
    }
}
