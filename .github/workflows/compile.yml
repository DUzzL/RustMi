name: Create Rustmi

on:
  workflow_dispatch :

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # One job, same as a local `./gradlew build`: cargo-zigbuild cross-compiles the native
  # library for all six platforms, Gradle packs them into one jar and runs every test.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Rust targets
        run: rustup target add aarch64-unknown-linux-gnu x86_64-pc-windows-gnu aarch64-pc-windows-gnullvm x86_64-apple-darwin aarch64-apple-darwin

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          # Tested version; 0.16 cannot link the macOS libraries.
          version: 0.14.1

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked --version 0.23.4

      - name: Setup JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'temurin'
          java-version: 25

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build and test
        run: ./gradlew build --no-daemon

      - name: Upload Rustmi
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: rustmi
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          compression-level: 0
