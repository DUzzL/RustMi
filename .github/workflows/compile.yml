name: Create Rustmi

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # One job, same as a local `./gradlew build`: cargo-zigbuild cross-compiles the native
  # library for all six platforms, Gradle packs them into one jar and runs every test.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Rust toolchain
        # Installs the channel, components and targets pinned in rust-toolchain.toml.
        run: rustup toolchain install

      - name: Rust format
        run: cargo fmt --check --manifest-path native/Cargo.toml

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: native

      - name: Clippy
        run: cargo clippy --manifest-path native/Cargo.toml --locked --all-targets -- -D warnings

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          # Tested version; 0.16 cannot link the macOS libraries.
          version: 0.14.1

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked --version 0.23.4

      - name: Setup JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'temurin'
          java-version: 25
          cache: gradle

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build and test
        run: ./gradlew build --no-daemon

      - name: native/lib.h is current
        # cargo regenerates the header from the Rust exports; it must be committed with them.
        run: git diff --exit-code native/lib.h

      - name: Upload Rustmi
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: rustmi
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          compression-level: 0
