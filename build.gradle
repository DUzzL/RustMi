plugins {
    id 'net.fabricmc.fabric-loom' version '1.15-SNAPSHOT'
}

version = project.rustmi_version
group = project.maven_group

base {
    archivesName = 'rustmi'
}

repositories {
    mavenCentral()
    maven { url = 'https://jitpack.io' }                       // MixinConstraints
    maven { url = 'https://maven.bawnorton.com/releases' }     // MixinSquared
    // libs/ as a flat-dir repository: Loom's include() needs a module component.
    flatDir { dirs 'libs' }
}

// Jars in libs/ are pinned by SHA-256 (see docs/DEVELOPMENT.md for how to update them).
def vendoredLibraries = [
        // Nalim 1.2.1-patched-autoinline, built from ../nalim (one.nalim.*).
        [file: file('libs/nalim.jar'),
         sha256: '069ca95d85681156de69c105ed4eb08366bb92017fb619a58eb8fc8d743651bb'],
        // Fabrolia classes Rustmi compiles against (= ../Fabrolia/release/fabrolia-fabric-
        // 0.2.38+alpha-26.3.jar of 2026-10-06); Fabrolia stays an optional runtime mod.
        [file: file('libs/fabrolia-compile.jar'),
         sha256: '25b00a027f20965fa92aa25034e1a6e1a311ad9582c698d91c40f5e87a6bd516']
]

tasks.register('verifyVendoredLibraries') {
    inputs.files(vendoredLibraries.collect { it.file })

    doLast {
        vendoredLibraries.each { library ->
            if (!library.file.isFile()) {
                throw new GradleException("Missing vendored library: ${library.file}")
            }
            def actual = java.security.MessageDigest.getInstance('SHA-256')
                    .digest(library.file.bytes).encodeHex().toString()
            if (actual != library.sha256) {
                throw new GradleException(
                        "SHA-256 mismatch for ${library.file.name}: expected ${library.sha256}, got ${actual}")
            }
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    include(implementation 'com.github.Tater-Certified:MixinConstraints:4856759a06')
    include(implementation(annotationProcessor("com.github.bawnorton.mixinsquared:mixinsquared-fabric:0.3.3")))
    // Nalim ships its own fabric.mod.json, so Fabric loads the nested jar as a library mod.
    include(implementation(group: '', name: 'nalim', version: '1.2.1-patched-autoinline', ext: 'jar'))
    compileOnly files('libs/fabrolia-compile.jar')
}

loom {
    accessWidenerPath = file('src/main/resources/rustmi.accesswidener')
}

apply from: 'gradle/native-bindings.gradle'
apply from: 'gradle/natives.gradle'

tasks.withType(JavaCompile).configureEach {
    dependsOn tasks.named('verifyVendoredLibraries')
    dependsOn tasks.named('generateNativeBindings')
    options.encoding = 'UTF-8'
    // Main stays at --release 17 to match the mixins' compatibilityLevel (JAVA_17); only
    // the generated FFM bindings need Java 25 (java.lang.foreign). The mod requires Java 25.
    options.release.set(name == 'compileFfmJava' ? 25 : 17)
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', project.minecraft_version
    filteringCharset 'UTF-8'
    filesMatching('fabric.mod.json') {
        expand 'version': project.version, 'minecraft_version': project.minecraft_version
    }
}

java {
    // Gradle on another JDK uses an installed JDK 25 (or fails with a clear message).
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

jar {
    from(sourceSets.ffm.output)
    from('LICENSE.txt', 'LICENSE-GPL-3.0.txt')
}

tasks.named('sourcesJar') {
    dependsOn tasks.named('generateNativeBindings')
    from(sourceSets.ffm.allSource)
}

// - - - - Tests: plain Java mains (no test framework), all wired into `check` - - - - \\

def mainTest = { String taskName, String testClass, String what, List<String> mainArgs = [] ->
    tasks.register(taskName, JavaExec) {
        group = 'verification'
        description = what
        dependsOn tasks.named('testClasses')
        classpath = sourceSets.test.runtimeClasspath
        mainClass.set(testClass)
        args mainArgs
        // Minecraft classes write logs/latest.log into the working directory.
        workingDir = layout.buildDirectory.dir('test-run').get().asFile
        doFirst { workingDir.mkdirs() }
    }
    tasks.named('check') { dependsOn taskName }
}

mainTest('nativeBindingsContractTest', 'com.github.tatercertified.nalim.rust.NativeBindingsContractTest',
        'Checks NalimBindings, the generated facade and FFM bindings against native/lib.h.',
        [file('native/lib.h').absolutePath])
mainTest('activeRegionBatchesTest', 'com.github.tatercertified.nalim.cramming.ActiveRegionBatchesTest',
        'Checks exact-id regional batch routing and JMM publication.')
mainTest('regionalCrammingGeometryTest', 'com.github.tatercertified.nalim.cramming.RegionalCrammingGeometryTest',
        'Checks regional cramming halo coverage boundaries.')
mainTest('collisionCompatibilityTest', 'com.github.tatercertified.nalim.collision.CollisionCompatibilityTest',
        'Checks collision fallback precision and mover-predicate gates.')
mainTest('explosionSeenClipTest', 'com.github.tatercertified.nalim.explosion.ExplosionSeenClipTest',
        'Checks full-cube exposure rays against Minecraft shape clipping.')

tasks.named('test') {
    failOnNoDiscoveredTests = false
}

// Rust unit and fixture tests (native/src, fixtures/).
tasks.register('cargoTest', Exec) {
    group = 'verification'
    description = 'Runs cargo test for native/.'
    workingDir 'native'
    commandLine 'cargo', 'test', '--release', '--locked'
}
tasks.named('check') { dependsOn 'cargoTest' }
